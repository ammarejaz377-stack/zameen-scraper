name: Daily Zameen scrape

on:
  # No schedule: trigger here -- GitHub's native cron scheduler proved
  # unreliable (confirmed via the Actions API: it silently failed to fire
  # on two separate attempts despite correct config and ample lead time).
  # An external cron service (cron-job.org) calls workflow_dispatch below
  # on a schedule instead -- same trigger type that has fired reliably
  # every time it's been used manually.
  workflow_dispatch: {}

env:
  # Private repo used purely as a data drop (Releases), so this public repo's
  # Actions minutes stay free while the actual scraped data stays non-public.
  DATA_REPO: ammarejaz377-stack/zameen-data

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5h safety margin under GitHub's 6h hard cap

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Notify run started
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/send_notification.py \
            "Zameen scraper run started" \
            "The daily scrape started at $(date -u +'%d-%m-%Y %H:%M:%S') UTC. Expect roughly 1-1.5 hours to complete."

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run sale spider
        run: scrapy crawl zameen_sale --logfile logs/sale.log
        continue-on-error: true  # still upload+email whatever the rent spider produces

      - name: Run rent spider
        run: scrapy crawl zameen_rent --logfile logs/rent.log
        continue-on-error: true

      - name: Publish data to the private data repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          FILES=()
          for f in output/zameen_sale/* output/zameen_rent/* logs/*.log; do
            [ -e "$f" ] && FILES+=("$f")
          done

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No output files produced -- nothing to publish." >&2
            exit 0
          fi

          TAG="run-$(date +%d-%m-%Y_%H-%M)"
          gh release create "$TAG" "${FILES[@]}" \
            --repo "$DATA_REPO" \
            --title "Zameen scrape $(date +%d-%m-%Y\ %H:%M) UTC" \
            --notes "Automated daily scrape output."

      - name: Email run summary
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          SUMMARIES=$(find output -name "*_summary.txt" 2>/dev/null)
          if [ -z "$SUMMARIES" ]; then
            echo "No summary files found -- spiders likely failed before producing output." >&2
            exit 1
          fi
          python scripts/send_summary_email.py $SUMMARIES
